server {
    listen 85;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend container ────────────────────────────────────────
    # Todas las peticiones a /api/ se redirigen al servicio "backend" en la red
    # interna de Docker. Ajusta el nombre del servicio si es diferente.
    location /api/ {
        # Manejar preflight CORS (OPTIONS) sin llegar al backend
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age'       1728000;
            add_header 'Content-Length'               0;
            return 204;
        }

        proxy_pass         http://portfolio-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  'Access-Control-Allow-Origin';

        # Añadir headers CORS a las respuestas del backend
        add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    }

    # ── Caché de assets estáticos ─────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Vue Router (history mode) ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compresión gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
